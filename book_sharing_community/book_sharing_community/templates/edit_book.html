{% extends "base.html" %}

{% block title %}Edit {{ book.title }} - BookShare{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="brand-icon-wrapper bg-warning-subtle text-warning">
                        <i class="bi bi-pencil-square fs-4"></i>
                    </div>
                    <div>
                        <h2 class="fw-bold font-serif mb-0">Edit Book Details</h2>
                        <p class="text-muted small mb-0">Update listing details for "{{ book.title }}"</p>
                    </div>
                </div>

                <form action="{{ url_for('books.edit_book', book_id=book.id) }}" method="POST">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold small">Book Title <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Author <span class="text-danger">*</span></label>
                            <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Genre <span class="text-danger">*</span></label>
                            <select name="genre" class="form-select" required>
                                {% for g in genres %}
                                    <option value="{{ g }}" {% if book.genre == g %}selected{% endif %}>{{ g }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold small">Physical Condition</label>
                            <select name="condition" class="form-select">
                                {% for c in conditions %}
                                    <option value="{{ c }}" {% if book.condition == c %}selected{% endif %}>{{ c }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold small">ISBN</label>
                            <input type="text" name="isbn" class="form-control" value="{{ book.isbn or '' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small">Cover Image URL</label>
                            <input type="url" name="cover_url" class="form-control" value="{{ book.cover_url or '' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small">Description / Notes</label>
                            <textarea name="description" class="form-control" rows="4">{{ book.description or '' }}</textarea>
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-2 pt-3">
                            <a href="{{ url_for('books.detail', book_id=book.id) }}" class="btn btn-light rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Save Changes</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
